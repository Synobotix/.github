name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Route handlers (/api/*) cannot be statically exported.
      # No WordPress API at build time, so no blog posts to pre-render either.
      - name: Drop server-only code
        run: rm -r app/api lib/posthog-server.ts "app/blog/[slug]"

      # Custom domain (public/CNAME) => served from "/", so no BASE_PATH.
      - name: Build static site
        run: npm run build
        env:
          STATIC_EXPORT: "1"
          NEXT_PUBLIC_POSTHOG_INGEST_HOST: https://eu.i.posthog.com

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
